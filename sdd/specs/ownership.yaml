# Spec ownership — which spec governs which code path.
#
# Read by .claude/hooks/sdd_gate.py, which BLOCKS Edit/Write to a governed path
# until the governing spec has been read in the current session.
#
# When you add a spec, add its globs here in the same change (constitution §5
# item 2) — an unmapped path falls back to `always` only.
#
# ⚠ ST-8 (inherited): a glob that matches NOTHING makes the gate fail OPEN,
# silently. When code moves, its glob moves in the SAME commit.

# Required before editing ANY governed source file, no exceptions.
always:
  - sdd/specs/constitution.md

# First matching entry wins; globs are fnmatch-style against the repo-relative path.
map:
  - globs:
      - "src/shared/registry/**"
      - "src/shared/agents/**"
      - "src/shared/ports/**"
    spec: sdd/specs/F1_module_registry/spec.md
    why: >
      F1 — the (port, variant) registry and the port protocols. Closed variant set
      (QR-7), module-scoped not agent-scoped (QR-8), provenance on every resolution.
      AgentPort is one registered port among several.
      ⚠ src/shared/ports/** is governed because D2 made __init__.py's __all__
      LOAD-BEARING: it is the sole source of required_ports (AC-1.4), the
      contract-suite map (AC-1.9), the earned-abstraction warning (AC-1.12) and the
      drift guard (AC-1.13). Adding a Protocol there changes what the build enforces,
      so it must not be editable without reading F1. AC-1.10 also constrains its
      CONTENTS — Protocol declarations only, no executable statement at module scope.

  # ═══ ABSORBED 2026-09-04 — MS-2.2a, per QR-22 ═══════════════════════════
  # ⚠ These paths moved here FROM ai-investment-pipeline. They are inherited
  # D-00 code and are now governed HERE, because "changes happen upstream" is
  # true only for domains NOT YET absorbed (CLAUDE.md).
  #
  # ⚠⚠ Governance is the FOURTH thing an absorption must move — after the code,
  # the tests, and the architecture rules that scan the path. Forgetting any of
  # them is invisible: the suite stays green (L3 DX-3).
  #
  # ⚠ The spec paths must be INSIDE this repo: sdd_gate.py's rel() returns None
  # for anything outside REPO, so a glob pointing at the upstream spec would
  # demand a spec the session can never record — blocking the path forever.
  - globs:
      - "src/shared/money.py"
    spec: sdd/design/rel6_design/L2-shared-money.md
    why: >
      L2-shared-money (AC-M.1…AC-M.21) — Decimal money, ROUND_HALF_UP, explicit
      currency (INV-5). ⚠ Absorbed 2026-09-04. Its own test asserts SI-1 per
      module, which is why the fence survived the move for THIS file and not for
      its siblings (L3 DX-3).

  - globs:
      - "src/shared/config.py"
      - "src/shared/errors.py"
      - "src/shared/logging.py"
      - "src/shared/secrets.py"
      - "src/shared/llm/**"
    spec: sdd/design/rel6_design/L2-shared-infrastructure.md
    why: >
      L2-shared-infrastructure (AC-0.4…AC-0.20, GW-nn, SI-1) — config, errors,
      logging, secrets and the LLM gateway. ⚠ ST-5: only the gateway calls an
      LLM. Absorbed 2026-09-04; upstream's copy of this spec is historical.

  - globs:
      - "src/orchestration/trace/**"
    spec: sdd/specs/F2_trace_replay/spec.md
    why: >
      F2 — step-level trace and replay. EXTENDS the existing RunManifest/RunOutcome
      (OR-13, immutable) downward to decision granularity; never duplicates it.
      Carries PG-9's propensity and PG-5.2's pre/post arms — both impossible to
      backfill, so they are designed in from record #1.

  - globs:
      - "src/data_engine/corporate_actions/**"
    spec: sdd/specs/F3_corporate_actions/spec.md
    why: >
      F3 — corporate-action CLASSIFICATION only. Detection stays with the existing
      symbology/detect.py ("no vendor, no search"); F3 supplies the cause, which is
      not in the data. Search precedes classification, always (PG-3).

  # ⚠⚠ F7a and F7b live INSIDE src/evaluation/**, so they must come FIRST —
  # first match wins (L4 §5.1). Until MS-8 this was recorded as a COMMENT saying
  # "F5's entry covers them", which upstream's own test_code_governing_specs_have_globs
  # could not read — it reported F7a as governing code with no globs (DX-10).
  # ★ A comment is not machine-readable; a glob is.
  - globs:
      - "src/evaluation/studies/killrule.py"
      - "src/evaluation/studies/deliberation_tier_a.py"
    spec: sdd/specs/F7a_deliberation_process_tests/spec.md
    why: >
      F7a — Tier-A process tests (T1-T7) and the PRE-REGISTERED kill rule.
      ⚠ PG-5.1: F7a GATES F6b. D1 found the DELETE verdict needs ~99 samples per
      arm against ~23 for KEEP, so budget pressure favours the verdict that
      preserves the capability — the bands must not be widened to save money.

  - globs:
      - "src/evaluation/studies/deliberation_tier_b.py"
    spec: sdd/specs/F7b_deliberation_outcome_study/spec.md
    why: >
      F7b — Tier-B outcome study. ⚠ It NEVER gates (PG-5.1). D2: both arms are
      scored as PAPER outcomes, so it measures the RECOMMENDATION, not the
      portfolio — and every figure must say so.

  - globs:
      - "src/evaluation/**"
    spec: sdd/specs/F5_evaluation_harness/spec.md
    why: >
      F5 — the shared measurement harness (PG-4). Spec-governed by QR-13: D-14
      inherits D-10's one-way import rule (ST-2) but NOT its spec exemption, because
      an unverified instrument is wrong in both portfolio lanes at once.

  - globs:
      - "src/orchestration/policy/routing.py"
    spec: sdd/specs/F6a_config_routing/spec.md
    why: >
      F6a — the routing function. Pure, deterministic, returns a reason and
      influenced_by (PG-9, PG-7). Lands beside the existing policy/{budget,retry}.py;
      does NOT create a parallel policy layer.

  - globs:
      - "src/orchestration/control/**"
    spec: sdd/specs/F8_control_surface/spec.md
    why: >
      F8 — the inbound human channel: full-depth drill-down (QR-16), designation,
      suspend/resume. ⚠ PARTIAL — the directives half is carved out and BLOCKED
      pending Victor's statement of intent (spec §2.1).

  - globs:
      - "src/fundamental/source/**"
    spec: sdd/specs/F9_thesis_source_port/spec.md
    why: >
      F9 — ThesisSourcePort with ApiAdapter (default, QR-20) and RelayAdapter.
      ⚠ The relay adapter WRAPS src/fundamental/relay/ (compose/ingest/confidence_of);
      it reimplements none of it, and verification must propagate unsoftened.

  - globs:
      - "src/explain/**"
    spec: sdd/specs/F4_explainability/spec.md
    why: >
      F4 — D-13 cross-view explanation ONLY (QR-10). Per-domain attribution stays in
      each analytical domain's own output contract; D-13 composes published outputs
      and must not import D-01 or D-03 internals (INV-014/ST-9).

  - globs:
      - "src/orchestration/graph/**"
    spec: sdd/specs/F6b_deliberation/spec.md
    why: >
      F6b — the deliberation state machine, and the ONLY directory permitted to import
      an orchestration framework (QR-14, F2 AC-2.10). ⚠ Graduation gate satisfied by
      F7a; DEPLOYMENT mode is set by F7a's band verdict (spec §2.1).

  # ═══ ABSORBED 2026-09-04 — MS-2.7. ⚠⚠ THIS ENTRY MUST STAY LAST OF THE
  #     src/orchestration/ ENTRIES. First match wins, and this glob CONTAINS
  #     four platform paths already governed above:
  #         src/orchestration/trace/**        -> F2   (line ~68)
  #         src/orchestration/policy/routing.py -> F6a (line ~93)
  #         src/orchestration/control/**      -> F8   (line ~101)
  #         src/orchestration/graph/**        -> F6b  (line ~125)
  #     ★ This is the EXACT hazard L4 §5.1 was written for, arriving live at
  #     MS-2.7 rather than at MS-8. If this entry were moved above them, the
  #     inherited L1 spec would silently govern platform code, the gate would
  #     still fire, and NOTHING would look broken. Enforced by MS-8 item 8.4a.
  - globs:
      - "src/orchestration/**"
    spec: sdd/design/rel6_design/L1-orchestration.md
    why: >
      L1-orchestration (OR-nn, 76 definitions) — D-08: the job graph, run
      manifest, locks, cadence, budget and retry policy. ⚠ ABSORBED 2026-09-04
      (QR-22) after Victor SUSPENDED the daily run, which voided the only
      objection to moving it. Upstream's copy of this spec is historical.
      ⚠ RunManifest/RunOutcome/manifest_store are OR-13 append-only — F2 EXTENDS
      them downward and must never write a second run-level record.

  # ═══ ABSORBED — governed from MS-8 onward ═══════════════════════════════
  # ⚠ Found at C7 (2026-09-04): src/recording/** was UNGOVERNED after the
  # absorption — L1-recording arrived with the code but no glob came with it,
  # so an edit there required only the constitution. That is DX-3's "fourth
  # thing" (globs) missed for a domain absorbed at MS-8 rather than MS-2.
  - globs:
      - "src/recording/**"
    spec: sdd/design/rel6_design/L1-recording.md
    why: >
      L1-recording (RC-nn) — D-11: broker ingestion, order grouping, the derived
      book, and the run record. ⚠ RC-65: the account set is DISCOVERED from the
      export directory, never listed in code — a hardcoded list silently ignores
      a new portfolio. RC-66: exports live in .state/broker/, outside the spec
      tier.

  # ⚠ F7a and F7b land inside src/evaluation/** which F5 already governs — no separate
  # glob. First matching entry wins, so F5's entry covers them.
  # First matching entry wins, so F5's entry covers it; F7a is cited from F5's ACs.

  - globs:
      - "src/feature_engineer/valuation/**"
    spec: sdd/specs/F10_valuation_trail/spec.md
    why: >
      F10 — D-02's valuation trail: the pure two-stage DCF mechanics, fv_model on a
      judgement-free basis, the sensitivity band and implied expectations, each with
      its full arithmetic trail. ★ Governed because D1 (Victor, 2026-09-13) lets a
      JUDGEMENT's normalised earnings run through these mechanics — and VS-1/FE-21
      make the type boundary between fv_model and fv_analyst load-bearing: an edit
      here can put seat 2's judgement into a seat-8 artifact seat 3 reads.
      ⚠ Only the valuation/ subtree: the rest of src/feature_engineer/ is inherited
      D-02 code governed by its L1 design, not by F10.

  - globs:
      - "src/feature_engineer/base_rates/**"
    spec: sdd/specs/F11_reference_class_base_rates/spec.md
    why: >
      F11 — reference-class base rates for J-10 (🟢 approved 2026-10-02). Members are
      Victor's config, every threshold must come from the subject's F10 trail (AC-F11.5),
      and every rate carries its n (AC-F11.6). Built 2026-10-02; the glob matches code.

  - globs:
      - "src/quant/**"
    spec: sdd/specs/F12_quant_core/spec.md
    why: >
      F12 — D-03 quant core (🟢 approved 2026-10-05): HorizonSet, the evaluation protocol
      D-04's promote() is judged by, the MethodEntry register, the daily Nomination.
      Graduates what was built, carries L1-quant §14's AC-3.x as AC-F12.k (DX-151: bare
      AC-3.x collides with F3). ⚠ Stateless (QA-28) and must not import src/models or
      src/fundamental (QA-28, INV-014). src/models/** (D-04) stays ungoverned by D4.

  - globs:
      - "tools/thesis_for.py"
      - "src/fundamental/on_demand/**"
    spec: sdd/specs/F13_thesis_on_demand/spec.md
    why: >
      F13 — thesis on demand (🟢 approved and built 2026-10-20): one command chaining the existing
      thesis steps, run ids as arguments, a resumable chain manifest. Subscription
      transport only (AC-F13.2); refuses an industry with no peer set (AC-F13.5).

  - globs:
      - "tools/size_for.py"
      - "src/portfolio/**"
    spec: sdd/specs/F14_sizing_on_demand/spec.md
    why: >
      F14 — position sizing on demand (🟡 draft 2026-10-25). D-06 was ungoverned (L9 §7.1:
      "ungoverned by any F-spec"); F14 governs the whole tree because the command composes the
      library and its ACs carry L1-portfolio-strategy's AC-6.18…6.21. Capital is D-11's REPORTED
      balance (RC-70…RC-77), policy numbers are Victor's with no default (PS-43), no LLM and no
      write (AC-F14.13, AC-F14.14).

  # ⚠ src/data_engine/{symbology,ingest,pit,...}/** stay UNGOVERNED here — inherited
  # D-07 code, changes upstream (vision §2) until the MS-8 absorption.

  # ⚠ src/orchestration/{contracts,state,jobs,policy,schedule}/** stay UNGOVERNED
  # here — they are inherited D-08 code and change upstream (vision §2) until the
  # M8 absorption, when their globs arrive pointing at the upstream L-specs.

  # Future entries land here as each spec graduates. Inherited domains
  # (src/fundamental/**, src/quant/**, ...) arrive with the MS-8 absorption,
  # repointed at their upstream L-specs.

# Paths deliberately NOT spec-governed. Never blocked.
exempt:
  - "*.md"                 # CLAUDE.md, README.md — project docs
  - "LICENSE"
  - ".gitignore"
  - "pyproject.toml"
  - "sdd/**"               # the SDD tier itself
  - "docs/**"              # study material — lectures, notes. Governs nothing.
  - ".claude/**"
  - "config/**"
  - "tests/**"             # tests encode ACs; they are the OUTPUT of reading a spec
  - "tests_src/**"
  - "src/experiments/**"   # D-10 — P7-exempt research, held by ST-2's one-way rule
  # ⚠ src/evaluation/** is deliberately NOT here — QR-13 made D-14 spec-governed.
  # Its globs land with F5.
