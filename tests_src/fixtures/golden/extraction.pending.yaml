      "The number of outstanding shares of the registrant's common stock as of
      June 18, 2025 was 1,119,125,101." ★ Note the date: 2025-06-18 is the
      cover-page count, three weeks after the 2025-05-29 period end.
    established_at: "____-__-__"
    established_by: "____"

  # ★ Unvested SBC still to be recognised — a future expense that never
  #   appears on the balance sheet. Dated at the period end, unlike the case
  #   above, which is why the two are here together.
  - case_id: mu-fy2025q3-sc-unvested-comp-cost
    input_ref: "run-2026-09-13T071638-mu-e10/extract:E-10:llm:1#sc.unvested||:2025-05-29"
    expected:
      evidence_id: sc.unvested
      unit: USD
      status: found
      tags: []
      period: {start: null, end: "2025-05-29"}
    source: >-
      Same filing, equity-plans note, fixture line 1022: "As of May 29, 2025,
      $1.73 billion of total unrecognized compensation costs for unvested
      awards, before the effect of any future forfeitures, was expected to be
      recognized..." ⚠ `value` NOT asserted (subset rule): "$1.73 billion" vs
      "1.73 billion" is a transcription boundary the document does not fix.
    established_at: "____-__-__"
    established_by: "____"

  # ⛔ DX-131 — DO NOT SIGN. Kept here rather than dropped because it is the
  #    clearest single demonstration of the finding: the DISCRETE quarter case
  #    (2025-03-01:2025-05-29) is fine and the YTD twin is not, from the same
  #    block, in the same run, differing only in whether a start date was
  #    computed. Sign the discrete one; leave this until the prompt is fixed.
  - case_id: mu-fy2025q3-sc-basic-weighted-shares-ytd
    input_ref: "run-2026-09-13T071638-mu-e10/extract:E-10:llm:1#sc.basic||2024-08-30:2025-05-29|ytd"
    expected:
