      status: found
      tags: [cumulative_ytd]
      period: {start: "2024-08-30", end: "2025-05-29"}   # ⛔ DX-131
    source: >-
      Same filing, Consolidated Statements of Operations, weighted-average
      basic shares, nine-month column. ⛔ HOLD: the nine-month start asserted
