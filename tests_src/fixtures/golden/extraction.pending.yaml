    established_at: "____-__-__"
    established_by: "____"

  # ★ An absence with teeth: no ICFR change was reported this quarter. If this
  #   flips to `found`, a material-weakness or remediation disclosure has
  #   appeared and an earnings-quality score must not stay where it was.
  - case_id: mu-fy2025q3-ap-icfr-absent
    input_ref: "run-2026-09-17T071619-mu-e09/extract:E-09:llm:1#ap.icfr||:"
    expected:
