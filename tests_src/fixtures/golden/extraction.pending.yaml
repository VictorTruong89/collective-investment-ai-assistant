      in internal control over financial reporting during the quarter that
      materially affected, or is reasonably likely to materially affect, ICFR —
      i.e. there is no reportable change to extract, which is distinct from the
      item being unexamined.
    established_at: "____-__-__"
    established_by: "____"

  # ══ E-10 · SHARE COUNT AND SBC ══════════════════════════════════════════
  # ★★ The cover-page share count, and the ONLY figure in this file dated
  #    2025-06-18 rather than the period end — it is stated as of the filing
  #    date, not the balance-sheet date. A block that flattened every period to
  #    the quarter end would silently move this by three weeks of issuance.
  #    ★ It is also the denominator `F10` divides equity value by, so an error
  #    here moves fair value per share directly.
  - case_id: mu-fy2025q3-sc-shares-outstanding
    input_ref: "run-2026-09-13T071638-mu-e10/extract:E-10:llm:1#sc.end_of_period||:2025-06-18"
    expected:
