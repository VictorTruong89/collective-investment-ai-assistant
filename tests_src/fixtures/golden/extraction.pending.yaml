      asserted (subset rule) — "approximately $14 billion" is prose.
    established_at: "____-__-__"
    established_by: "____"

  # ★ The CONDITION attached to the buyback authorisation, which is where the
  #   CHIPS Act restriction lives. A capital-allocation judgement that reads
  #   the $10bn authorisation without this condition overstates how freely MU
  #   can act on it.
  - case_id: mu-fy2025q3-cp-buyback-condition
    input_ref: "run-2026-09-13T071852-mu-e12/extract:E-12:llm:1#cp.condition|buyback authorization|:"
