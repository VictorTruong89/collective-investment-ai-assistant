# ═══════════════════════════════════════════════════════════════════════════
# ⏳ ADDED 2026-09-17 AFTER THE `DX-132` FIX — 3 CASES FOR `E-13` (INDUSTRY)
#
# ★★ `E-13` is the block that unblocked `DX-117` and let `J-03` score a moat for
#    the first time. Until today it could not be PROMOTED — `promote_recording`
#    matched a recording's bundle only against the filing fixtures, and a sector
#    bundle carries the COMPETITORS' documents, so it scored {'MU': 0, 'AMD': 0}
#    and refused. ⇒ The evidence that moved the scorecard was itself ungradeable.
#    `DX-132` adds the sector branch; the ingested sector file is now COPIED into
#    the recording (`.state/` is gitignored, so a reference would not survive a
#    clone — `DX-12` again).
#
# ★ Verify these against the SOURCE DOCUMENTS, not against MU's 10-Q:
#      tests_src/fixtures/industry/sndk-edgar/     (Sandisk 10-Q, Kioxia K2)
#      tests_src/fixtures/industry/samsung-ir/     (Samsung earnings release)
#      tests_src/fixtures/industry/skhynix-ir/     (SK hynix earnings release)
#    Each has a `.meta.json` sidecar naming its URL and retrieval date.
#
# ⚠⚠ NO `not_found` CASES ARE DRAFTED FOR THIS BLOCK, and the reason is a
#    finding: `DX-135`. The parse blanks the `qualifier` on an absent item, so
#    the five recorded absences — Kioxia timing, Kioxia conditional, Samsung
#    timing, Samsung conditional, SK hynix capacity — collapse into THREE
#    anonymous rows. *"SK hynix did not disclose capacity"* and *"Samsung did
#    not disclose timing"* become indistinguishable, and two absences are lost
#    outright. Until that is ruled on, an absence here cannot be pinned to the
#    competitor it is about, which is the only thing that makes it useful.
# ═══════════════════════════════════════════════════════════════════════════

cases:

  # ★★ THE CITATION CASE. `DX-121` was a real defect: industry quotes were being
  #   stamped with MICRON's accession number, so evidence from Samsung's
  #   earnings release cited an SEC filing Samsung never made. The fix was
  #   `sector_citation()` + `Span.resolve` searching the sector parts. ⇒ This
  #   case pins that a competitor's item names the COMPETITOR's source.
  #   ⚠ If `cx.source` ever returns a Micron accession again, this goes red —
  #     and nothing else in the suite would notice.
  - case_id: mu-2025q3-cx-source-samsung
    input_ref: "run-2026-09-16T070237-mu-e13-replay/extract:E-13:llm:1#cx.source|Samsung HBM3E 12H ramp|:"
    expected:
      evidence_id: cx.source
      qualifier: Samsung HBM3E 12H ramp
      value: samsung-ir
      status: found
    source: >-
      Sector file memory_semiconductors v1 (source_list config/sector/memory_v1.yaml,
      ingested copy travels with the recording as sector_file.json), record
      sourced from Samsung Electronics' quarterly earnings release held at
      tests_src/fixtures/industry/samsung-ir/ with its .meta.json provenance
      sidecar. The source id for that document is `samsung-ir`.
    established_at: "____-__-__"
    established_by: "____"

  # ★ A competitor named from a THIRD party's filing. The Kioxia K2 fab is
  #   disclosed in SANDISK's 10-Q (they run Flash Ventures jointly), not by
  #   Kioxia — so the subject of the record and the author of the document are
  #   different companies. ⚠ A block that conflated them would attribute
  #   Sandisk's disclosures to Kioxia, or drop the record for having no
  #   first-party source.
  - case_id: mu-2025q3-cx-competitor-kioxia-via-sandisk
    input_ref: "run-2026-09-16T070237-mu-e13-replay/extract:E-13:llm:1#cx.competitor|Kioxia K2 (Sandisk/Flash Ventures)|:"
    expected:
      evidence_id: cx.competitor
      qualifier: Kioxia K2 (Sandisk/Flash Ventures)
      value: Kioxia
      status: found
    source: >-
      Sector file memory_semiconductors v1, record sourced from Sandisk's
      10-Q (source id `sndk-20250328`, held at
      tests_src/fixtures/industry/sndk-edgar/), which describes the Kitakami
      K2 wafer fabrication facility operated through Flash Ventures with
      Kioxia. ⚠ Kioxia is the SUBJECT; Sandisk is the filer. Confirm the
      document supports naming Kioxia as the competitor before signing —
      Kioxia was deliberately EXCLUDED from the peer set as a direct
      comparable, and appears here only as the subject of a third party's
      disclosure.
    established_at: "____-__-__"
    established_by: "____"

  # ★★ The CLASSIFICATION item, and the one case here with a known weakness you
  #   should weigh. `cx.status` takes one of four declared labels — announced /
  #   under construction / commissioning / operating — and `DX-122` EXEMPTS it
  #   from `X-01` ②, because the label is a classification rather than a
  #   quotation. ⚠⚠ The consequence, recorded at the time: nothing checks that
  #   the cited span is the sentence the status was read FROM, and on the Kioxia
  #   record an unrelated gross-profit sentence was cited for "under
  #   construction". ⇒ Signing this pins the LABEL, which is the substantive
  #   claim, and pins nothing about where it came from. `E-13 v2` is the fix.
  - case_id: mu-2025q3-cx-status-samsung-announced
    input_ref: "run-2026-09-16T070237-mu-e13-replay/extract:E-13:llm:1#cx.status|Samsung HBM3E 12H ramp|:"
    expected:
      evidence_id: cx.status
      qualifier: Samsung HBM3E 12H ramp
      value: announced
      status: found
    source: >-
      Sector file memory_semiconductors v1, Samsung record (source id
      `samsung-ir`): the earnings release states an intention to ramp enhanced
      HBM3E 12H to meet initial demand. Judge whether "announced" is the right
      one of the four declared labels for a stated intention to ramp, as
      against "commissioning" or "operating".
    established_at: "____-__-__"
    established_by: "____"
