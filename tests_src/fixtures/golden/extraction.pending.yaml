  # ══ E-12 · CAPITAL PLANS ════════════════════════════════════════════════
  # ★★ The forward capex commitment — "approximately $14 billion", stated NET
  #    OF government incentives. ⚠⚠ That "net of" is the whole case: `DX-116`
  #    established that the incentive proceeds are invisible in XBRL, so this
  #    prose figure is the only place the net number exists. A block that
  #    dropped the qualifier would produce a gross-looking $14bn that is not
  #    comparable to the $10,199M gross capex in the cash flow statement.
  - case_id: mu-fy2025-cp-capex-commitment
    input_ref: "run-2026-09-13T071852-mu-e12/extract:E-12:llm:1#cp.commitment|capex 2025|2024-08-30:2025-08-28"
    expected:
      evidence_id: cp.commitment
      qualifier: capex 2025
      unit: USD
      status: found
      tags: []
      # ⚠ This period is the FORECAST fiscal year 2025, not a reported period —
      #   end 2025-08-28 is MU's fiscal year end. Check you accept that framing.
      period: {start: "2024-08-30", end: "2025-08-28"}
    source: >-
      MU 10-Q, accession 0000723125-25-000021, MD&A liquidity discussion
      (fixture lines 1369-1371): the sentence estimating capital expenditures
      for property, plant, and equipment in 2025, NET of proceeds from
