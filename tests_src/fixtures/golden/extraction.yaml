# ═══════════════════════════════════════════════════════════════════════════
# ⏳⏳ WITHDRAWN 2026-09-11 (`DX-74`) — 2 AMD seg.basis_note CASES
#
# ⚠⚠ These are UNADDRESSABLE in the `v4` recording, not failing in it. The
#    values are still present and still correct. What vanished is the field
#    that TELLS THEM APART.
#
# ★★★ Measured on the two AMD runs, 82 minutes apart, same prompt family:
#
#      run-...T070909 (v3+envelope)  3 basis notes, each with a qualifier:
#         'Segment structure change / restatement'
#         'Client and Gaming sub-rows'
#         'Goodwill reassignment'
#      run-...T082118 (v4)           4 basis notes, ALL with qualifier ''
#
#    ==> 4 items collapse onto one `MP-18` identity and `_select` refuses —
#        correctly. Taking the first would hide exactly the ambiguity MP-18
#        exists to prevent.
#
# ⚠⚠ THE STRUCTURAL POINT, which is bigger than these two cases: `qualifier`
#    is FREE TEXT THE MODEL INVENTS, and `MP-18` makes it part of the identity.
#    It has now been observed to REWORD between runs ('restatement basis' ->
#    'Segment structure change / restatement') and to DISAPPEAR entirely. An
