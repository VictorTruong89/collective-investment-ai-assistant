# MS-1.1 — CI. ✏ Rewritten at MS-8: there is ONE tree now.
#
# ★ The guarantees this runs were established between MS-1 and MS-7 and each held
#   because it was run by hand, once. This is what makes them properties.
#
# ⚠⚠ The sibling-checkout machinery is GONE (MS-8 absorbed the last domain), but
#   its rule outlives it: `src` and `tests_src` are still IMPLICIT NAMESPACE
#   PACKAGES. Do not add a root `src/__init__.py` — a regular package ends the
#   import scan (DX-1), and the pre-flight step below fails if one appears.
#
# ⚠ The real BMO broker statements are NOT in git and never will be (DX-5, QR-12).
#   A clone is expected to SKIP those ~41 tests loudly, not fail.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # ⚠ 3.10 matches the tf_gpu environment the pipeline contracts for.
          python-version: "3.10"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest ruff pandas pyarrow PyYAML numpy

      - name: Pre-flight — the namespace rule outlives the split (DX-1)
        run: |
          test -d src || { echo "⛔ no src/"; exit 1; }
          test -f tests_src/architecture.py || {
            echo "⛔ tests_src/architecture.py missing — the architecture rules cannot run"
            exit 1; }
          test -e src/__init__.py && {
            echo "⛔ src/__init__.py exists. `src` is an implicit NAMESPACE package;"
            echo "   a regular package ends the import scan (DX-1)."; exit 1; }
          echo "✅ layout is correct"

      - name: All checks
        run: python tools/check_all.py
