experiment:
  features: ALL_FEATURES
  label_horizon: 1w
  seed: 42
  validation:
    scheme: cpcv
    n_groups: 6
    n_test_groups: 2
    embargo_days: 5
    label_horizon_days: 5
  selection:
    metric: pred_reg_ic_mean
    direction: max
    gate: null
    gate_min: null
    sigma_penalty: 0.5
    default_variant: ft_reg__dt64_nl3
  config_overrides:
    costs:
      cls_threshold_bps: 16
    allocation:
      max_slots: 3
  variants:
