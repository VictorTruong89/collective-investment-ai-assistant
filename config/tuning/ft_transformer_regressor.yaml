# Feature 3-c tuning sweep — ft_transformer / regressor (rel5_features.md §3c)
# Coordinate-descent role sweep: only regressor knobs vary; selected on pred_reg_ic_mean (§3c.1).
# 6 cells, CPCV (N=6/k=2 -> 15 splits / 5 paths), purge+embargo.
