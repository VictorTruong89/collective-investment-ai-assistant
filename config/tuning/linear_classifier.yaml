      paradigm: separate
      hyperparameters:
        classifier:
          max_iter: 2000
          C: 0.01
      backend: linear
    - id: lin_cls__C01
      paradigm: separate
      hyperparameters:
        classifier:
          max_iter: 2000
          C: 0.1
      backend: linear
    - id: lin_cls__C1
      paradigm: separate
      hyperparameters:
        classifier:
          max_iter: 2000
          C: 1
      backend: linear
    - id: lin_cls__C10
