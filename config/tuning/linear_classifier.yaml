experiment:
  features: ALL_FEATURES
  label_horizon: 1w
  seed: 42
  validation:
    scheme: cpcv
    n_groups: 6
    n_test_groups: 2
    embargo_days: 5
    label_horizon_days: 5
  selection:
    metric: pred_auc
    direction: max
    gate: null
    gate_min: null
    sigma_penalty: 0.5
