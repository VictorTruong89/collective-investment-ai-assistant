# Feature 3-c tuning sweep — lstm / joint (sequence) (rel5_features.md §3c)
# Coordinate-descent role sweep: only joint (sequence) knobs vary; selected on pred_rank_ic_mean (§3c.1).
# 6 cells, CPCV (N=6/k=2 -> 15 splits / 5 paths), purge+embargo.
# DEEP model on CPCV is SLOW (~15 fits/cell). MUST run on the tf_gpu
# box (§3c.8). Consider a walk-forward screen (max_folds:2) first.
# Generated by grid_gen — edit the spec + regenerate, don't hand-edit.
# Run: python -m pipeline.main_pipeline --mode experiment --experiments {this file}
# =====================================================================

experiment:
  features: ALL_FEATURES
  label_horizon: 1w
  seed: 42
  validation:
    scheme: cpcv
    n_groups: 6
    n_test_groups: 2
    embargo_days: 5
    label_horizon_days: 5
  selection:
    metric: pred_rank_ic_mean
    direction: max
    gate: pred_rank_ic_ir
    gate_min: 0.3
    sigma_penalty: 0.5
    default_variant: lstm__look60_hidd64
  config_overrides:
    costs:
      cls_threshold_bps: 16
    allocation:
      max_slots: 3
  variants:
    - id: lstm__look20_hidd32
      paradigm: sequence
      hyperparameters:
        mlp_hidden: 64
        dropout: 0.2
        lr: 0.001
        epochs: 50
        batch_size: 512
        patience: 5
        lookback: 20
        hidden: 32
    - id: lstm__look20_hidd64
