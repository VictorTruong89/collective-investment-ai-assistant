# Feature 3-c tuning sweep — sklearn_gb / ranker (rel5_features.md §3c)
# Backend now = HistGradientBoosting (NaN-native + ~10-100x faster than
# classic GradientBoosting, which crashed on the 96%-NaN panel).
# Grid = HistGB knobs (max_depth x learning_rate x max_leaf_nodes); the old
# 'subsample' knob is N/A for HistGB. train_only_selected_role: trains only
# the ranker (identical primary metric, ~3x faster). 27 cells, CPCV.
# Run: python -m pipeline.main_pipeline --mode experiment --experiments {this file}
# =====================================================================

experiment:
  features: ALL_FEATURES
  label_horizon: 1w
  seed: 42
  validation:
    scheme: cpcv
    n_groups: 6
    n_test_groups: 2
    embargo_days: 5
    label_horizon_days: 5
  train_only_selected_role: true
  selection:
    metric: pred_rank_ic_mean
    direction: max
    gate: pred_rank_ic_ir
    gate_min: 0.3
    sigma_penalty: 0.5
    default_variant: skgb_rk__md3_lr005_mln31
  config_overrides:
    costs:
      cls_threshold_bps: 16
    allocation:
      max_slots: 3
  variants:
    - id: skgb_rk__md2_lr002_mln15
      paradigm: separate
      hyperparameters:
        ranker:
          n_estimators: 300
          min_samples_leaf: 20
          max_features: 0.9
          max_depth: 2
          learning_rate: 0.02
          max_leaf_nodes: 15
      backend: sklearn
    - id: skgb_rk__md2_lr002_mln31
      paradigm: separate
      hyperparameters:
        ranker:
          n_estimators: 300
          min_samples_leaf: 20
          max_features: 0.9
          max_depth: 2
          learning_rate: 0.02
          max_leaf_nodes: 31
      backend: sklearn
