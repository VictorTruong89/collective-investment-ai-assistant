anthropic:
  api_key: "${ANTHROPIC_API_KEY}"   # Set env var ANTHROPIC_API_KEY

google_api:
  key: "${GOOGLE_API_KEY}"

fmp:
  api_key: "${FMP_API_KEY}"          # FMP Starter — set FMP_API_KEY in .env (source it before running)
  cache_ttl_hours: 168               # 7 days — re-fetch after this
  rate_limit_seconds: 0.35           # delay between API calls (Starter: 300/min)

# Release 5 Feature 1 — unified market-data provider layer (pipeline/data_providers).
# Single source of truth for OHLCV / fundamentals / news / consensus. FMP Starter
# serves ~20yr split-adjusted OHLCV + ~10yr quarterly fundamentals in one call.
# No fallback source: if FMP is unavailable, a loud WARNING is logged — re-run
# once it recovers.
market_data:
  source: fmp                        # provider selector (only `fmp` is implemented)
  fmp:
    api_key: "${FMP_API_KEY}"
    base_url_stable: "https://financialmodelingprep.com/stable"
    rate_limit_seconds: 0.35         # 300/min Starter cap
    cache_ttl_hours: 18              # recent OHLCV (re-pull on trading days)
    fundamentals_cache_ttl_hours: 168
    max_history_rows: 5000           # FMP per-call cap (~20yr daily)

# Release 5 Feature 2 — unified pipeline (shared core in pipeline/core).
feature_2:
  enable_group_c: true               # add Buffett-derived formula features (graham ratio, moat quant) to training
  # Feature 3-c §9: keep NaNs at train time (RF/HistGB/GBDTs handle them
  # natively; Linear median-imputes). true (old behaviour) zero-filled at
  # train but NOT at inference — a train/serve skew, and a mismatch with the
  # CPCV protocol the production configs were tuned under.
  fillna_zero: false
# SignalEngine veto+escalate thresholds (rel5_features.md §2.5). Defaults shown.
signal_engine:
  enable_in_backtest: true           # fuse via SignalEngine in Phase 3a/3b (formula-only gates; LLM/DCF vetoes live-only)
  margin_of_safety_floor: -0.30      # held name >30% above intrinsic → risk-trim
  min_quality_gates: 1               # < this many of 4 gates passed → block buy
  escalate_size_multiplier: 1.5      # STRONG_BUY size-up
  max_weight_per_name: 0.34
  trim_fraction: 0.5
  # Release 5 Feature 3-b — soft blend (§3b.7): combine OHLCV ML + fundamental +
  # technical into ONE rankable score; the sleeve policy takes the daily top-1.
  # Weights are renormalised over whichever components are present (a missing
  # fundamental/technical signal degrades gracefully to OHLCV-only).
  blend:
    ohlcv: 1.0                        # OHLCV ML opportunity (SleeveSelector blend)
    fundamental: 0.5                  # fundamental quality/value/trend composite
    technical: 0.0                    # entry-timing score (wire up when available)

# Release 5 Feature 3-b — signal policy: daily top-1, 5 overlapping weekday
# sleeves (rel5_features.md §3b). Supersedes the pre-3b ≤3-name daily policy.
backtest:
  # QA-50 (L1-quantitative-analysis §5.6a): backtests MUST account for cost.
  # The prior `false` understated cost by 100%. Commission-only understates by
  # 50-70% — strictly more accurate, and QA-49 (spread+slippage) stays open.
  # The old comment "$20 round-trip immaterial at realistic capital" was FALSE
  # at this repo's own capital: initial_capital is hard-coded to $20,000
  # (backtester.py:107), where $20 is 50 bps of a 1w position and 210 bps of a
  # 1m one. Pinned by tests/test_flat_trade_fee.py (QA-62 known-answer test).
  charge_transaction_cost: true      # costs_charged = commission_only
  weekly_observation: true           # §3b.6 — report non-overlapping weekly-lot Sharpe

fundamental:
  store_root: "data/fundamentals"
  universe: "config/sp500_tickers.yaml"   # S&P 500 ticker list with sectors + CIKs
  edgar:
    user_agent_email: "tnqthang1989@gmail.com"
    min_request_interval: 0.15    # SEC allows 10 req/sec; 0.15s is safe
    timeout: 30
    max_retries: 3
  scheduler:
    lookback_days: 3650
    fetch_price_proxies: false

