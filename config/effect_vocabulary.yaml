# ⛔⛔ BLOCKER BEFORE `adopted: true` — `DX-59`
# ═══════════════════════════════════════════════════════════════════════════
#
#   **All three thresholds are defined TWICE**, independently and by literal:
#     · `src/risk/exposure/aggregate.py`      (D-05 — what the report warns about)
#     · `src/portfolio/sizing/risk_based.py`  (D-06 — what the sizer will propose)
#
#   ★★★ A restated constant is harmless while it is CONSTANT. **The moment a
#   directive can move it, the copies become a divergence** — and that is a
#   consequence this vocabulary creates, not one that existed before.
#
#   ⚠ A directive lowering the D-05 copy changes what you are WARNED about and
#     leaves what the system will PROPOSE at 25.0. `AC-8.17` would still pass:
#     the applied values are deterministic. The behaviour would not be.
#
#   ⇒ Recommended fix ⓑ: both read ONE config entry. `RA-48` already says these
#     belong in config and should appear in the `RunManifest`, so the effect's
#     `target` becomes a config key rather than a source line — which is also
#     what makes it replayable (`AC-8.13`).
