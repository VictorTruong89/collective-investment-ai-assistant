name: ai-investment-pipeline
channels:
  - conda-forge
  - defaults

dependencies:
  # Core Python
  - python=3.10

  # Data science stack
  - numpy
  - pandas
  - pyarrow
  - scikit-learn
  - joblib
  - tqdm
  - lightgbm
  - matplotlib

  # TensorFlow GPU (Conda-forge version)
  - tensorflow-gpu

  # XGBoost (GPU-enabled build)
  - xgboost

  # Utility libs
  - requests
  - pip
  - distro

  # FastAPI infer UI and news aggregator dependencies
  # Core pipeline does NOT depend on these —
  # install only on env running web server / news-enriched infer mode.
  - fastapi>=0.115
  - uvicorn[standard]>=0.34
  - feedparser>=6.0
  - finnhub-python>=2.4
  - python-multipart>=0.0.9
  - aiofiles>=23.0
  - openpyxl>=3.1          # F4: pandas needs this to read the broker .xlsx export

  # Pip-only packages
  - pip:
      - protobuf==4.25.3
